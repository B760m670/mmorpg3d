<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0f12" />
    <title>Open World — Ocean</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #0b0f12;
        overscroll-behavior: none; -webkit-user-select: none; user-select: none;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; touch-action: none; }

      /* Touch controls (created only on touch devices) */
      #touch-layer {
        position: fixed; left: 0; top: 0; width: 52%; height: 100%;
        touch-action: none; z-index: 5;
      }
      #look-layer {
        position: fixed; right: 0; top: 0; width: 48%; height: 100%;
        touch-action: none; z-index: 5; display: none;
      }
      #joy-base {
        position: fixed; width: 124px; height: 124px;
        margin-left: -62px; margin-top: -62px; border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.05);
        opacity: 0; transition: opacity 0.15s ease; pointer-events: none;
      }
      #joy-knob {
        position: absolute; left: 50%; top: 50%;
        width: 56px; height: 56px; border-radius: 50%;
        background: rgba(235, 244, 248, 0.38);
        transform: translate(-50%, -50%);
      }
      #touch-buttons {
        position: fixed; right: 14px; bottom: calc(18px + env(safe-area-inset-bottom));
        display: flex; flex-direction: column; gap: 10px; z-index: 6;
      }
      .tbtn {
        font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #eaf2f6; background: rgba(18, 26, 32, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px;
        padding: 13px 15px; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      }

      #hud {
        position: fixed;
        left: 16px;
        bottom: 14px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: rgba(230, 238, 242, 0.75);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        user-select: none;
      }
      #hud b { color: #eaf2f6; }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(230, 238, 242, 0.6);
        background: #0b0f12;
        transition: opacity 0.6s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div><b>W / ↑</b> throttle &nbsp; <b>S / ↓</b> reverse &nbsp; <b>A D / ← →</b> steer</div>
      <div><b>N</b> day / night &nbsp; <b>C</b> free camera</div>
    </div>
    <div id="loading">loading ocean…</div>
    <script>
  // If start-up fails, say so on the loading screen instead of hanging.
  (function () {
    function show(msg) {
      var el = document.getElementById('loading');
      if (el && !el.classList.contains('hidden')) {
        el.style.cssText += ';white-space:pre-wrap;text-align:center;padding:24px;text-transform:none;letter-spacing:0';
        el.textContent = 'Не удалось запустить игру\n\n' + msg;
      }
    }
    window.addEventListener('error', function (e) { show(e.message || String(e.error)); });
    window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
  })();
</script>
<script type="module" src="/src/main.js"></script>
  </body>
</html>
